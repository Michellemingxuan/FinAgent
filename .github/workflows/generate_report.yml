name: Generate Finance Report

on:
  # 7:00 AM SGT = 23:00 UTC previous day.
  # Fire on every possible eve-of-1st (UTC days 28-31); the `gate` job below
  # only lets the report run when the *next* SGT day is the 1st of the month.
  schedule:
    - cron: "0 23 28-31 * *"

  # Manual trigger — "click link to update now"
  workflow_dispatch:
    inputs:
      section:
        description: "Section to run (all / analyst / news / financials / geo)"
        required: false
        default: "all"
      new_ticker:
        description: "Ticker symbol to add to the watchlist (optional)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Decide whether today's scheduled run should proceed.
  # Manual runs (workflow_dispatch) always proceed; scheduled runs only
  # proceed on the eve of the 1st (so the report lands 7 AM SGT on the 1st).
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if next SGT day is the 1st
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEXT_DAY=$(date -u -d '+1 day' +%d)
          if [ "$NEXT_DAY" = "01" ]; then
            echo "Eve of the 1st (SGT) — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the eve of the 1st (next UTC day is $NEXT_DAY) — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          WSJ_COOKIE: ${{ secrets.WSJ_COOKIE }}
          GITHUB_REPO: ${{ github.repository }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          CMD="python main.py --section ${{ github.event.inputs.section || 'all' }}"
          if [ -n "${{ github.event.inputs.new_ticker }}" ]; then
            CMD="$CMD --add-ticker ${{ github.event.inputs.new_ticker }}"
          fi
          $CMD

      - name: Commit updated config (if ticker added)
        run: |
          git config user.name  "FinAgent Bot"
          git config user.email "finagent-bot@users.noreply.github.com"
          git add config/stocks.json
          if git diff --cached --quiet; then
            echo "No config changes."
          else
            git commit -m "chore: add ticker ${{ github.event.inputs.new_ticker }} [skip ci]"
            git push
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: false
          commit_message: "deploy: report $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
