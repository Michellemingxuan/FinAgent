name: Generate Finance Report

on:
  # 7:00 AM SGT = 23:00 UTC previous day — runs every weekday
  schedule:
    - cron: "0 23 * * 0-4"

  # Manual trigger — "click link to update now"
  workflow_dispatch:
    inputs:
      section:
        description: "Section to run (all / analyst / news / financials / geo)"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          WSJ_COOKIE: ${{ secrets.WSJ_COOKIE }}
          GITHUB_REPO: ${{ github.repository }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python main.py --section ${{ github.event.inputs.section || 'all' }}

      - name: Commit updated report
        run: |
          git config user.name  "FinAgent Bot"
          git config user.email "finagent-bot@users.noreply.github.com"
          git add output/index.html output/trigger.html output/archive/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update report $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git push
          fi
